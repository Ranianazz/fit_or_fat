<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Fit or Fat - Character Selection</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- START SCREEN (hidden after selection) -->
    <div id="startScreen" class="start-screen">
      <div class="start-card">
        <h1 class="start-title">FIT or FAT</h1>
        <p class="start-subtitle">Choose your champion</p>
        <div class="character-selector">
          <div class="char-card" data-character="boy">
            <div class="char-avatar boy-avatar"></div>
            <h3>Boy</h3>
            <p>Balanced adventurer</p>
          </div>
          <div class="char-card" data-character="girl">
            <div class="char-avatar girl-avatar"></div>
            <h3>Girl</h3>
            <p>Quick & agile</p>
          </div>
          <div class="char-card" data-character="unicorn">
            <div class="char-avatar unicorn-avatar"></div>
            <h3>Unicorn</h3>
            <p>Magical eater</p>
          </div>
        </div>
        <button id="playGameBtn" class="play-start-btn" disabled>
          ▶ PLAY GAME ◀
        </button>
        <div class="start-hint">
          ✨ Catch salads → faster & thinner! Avoid 3 burgers ✨
        </div>
      </div>
    </div>

    <!-- MAIN GAME CONTAINER (hidden initially) -->
    <div id="gameWrapper" style="display: none">
      <h1>🥗 FIT or FAT 🍔</h1>
      <div id="status">
        ✨ Catch salads → faster & thinner! Avoid burgers → 3 burgers = GAME
        OVER ✨
      </div>
      <div
        class="game-container"
        style="position: relative; display: inline-block"
      >
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div
          id="gameOverLayer"
          style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 18px;
          "
        ></div>
      </div>
      <div class="controls-hint">◀ LEFT ARROW • RIGHT ARROW ▶</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
